[project]
name = "trade-stats"
version = "2.1.0"
description = "Deterministic trade-performance statistics for quantitative trading systems."
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5", "black>=24.0", "mypy>=1.10", "coverage>=7.0", "pre-commit>=3.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["trade_stats", "config"]

[tool.coverage.report]
fail_under = 90
